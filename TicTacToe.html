<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #1e1e2f;
            color: white;
            text-align: center;
            padding-top: 40px;
        }
        h1 {
            color: #00d4ff;
        }
        #status {
            font-size: 20px;
            margin: 20px;
        }
        .board {
            display: grid;
            grid-template-columns: repeat(3, 90px);
            gap: 8px;
            justify-content: center;
            margin: 25px auto;
        }
        .cell {
            width: 90px;
            height: 90px;
            background: #33334d;
            border: none;
            border-radius: 10px;
            font-size: 35px;
            font-weight: bold;
            color: white;
            cursor: pointer;
        }
        .cell:hover {
            background: #454568;
        }
        button#restart {
            padding: 12px 25px;
            background: #00d4ff;
            color: #1e1e2f;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <h1>TIC TAC TOE</h1>
    <p id="status">Player X's turn</p>
    <div class="board" id="board">
        <button class="cell"></button>
        <button class="cell"></button>
        <button class="cell"></button>
        <button class="cell"></button>
        <button class="cell"></button>
        <button class="cell"></button>
        <button class="cell"></button>
        <button class="cell"></button>
        <button class="cell"></button>
    </div>
    <button id="restart" onclick="restartGame()">
        Restart Game
    </button>
    <script>
        const cells = document.querySelectorAll(".cell");
        const statusText = document.getElementById("status");
        const winningCombinations = [
            [0, 1, 2],
            [3, 4, 5],
            [6, 7, 8],
            [0, 3, 6],
            [1, 4, 7],
            [2, 5, 8],
            [0, 4, 8],
            [2, 4, 6]
        ];

        let boardState = Array(9).fill("");
        let currentPlayer = "X";
        let gameActive = true;

        cells.forEach((cell, index) => {
            cell.dataset.index = index;
            cell.addEventListener("click", () => {
                if (boardState[index] !== "" || !gameActive || currentPlayer !== "X") {
                    return;
                }

                makeMove(index, "X");

                if (!gameActive) {
                    return;
                }

                currentPlayer = "O";
                statusText.textContent = "Computer O is thinking...";

                setTimeout(() => {
                    if (!gameActive) {
                        return;
                    }

                    const bestMove = getBestMove();
                    if (bestMove !== null) {
                        makeMove(bestMove, "O");
                    }

                    if (gameActive) {
                        currentPlayer = "X";
                        statusText.textContent = "Player X's turn";
                    }
                }, 400);
            });
        });

        function makeMove(index, player) {
            boardState[index] = player;
            cells[index].textContent = player;

            if (checkWinner(player)) {
                return;
            }

            const isDraw = boardState.every(cell => cell !== "");
            if (isDraw) {
                statusText.textContent = "It's a draw!";
                gameActive = false;
            }
        }

        function checkWinner(player) {
            for (const combination of winningCombinations) {
                const [a, b, c] = combination;
                if (
                    boardState[a] !== "" &&
                    boardState[a] === boardState[b] &&
                    boardState[b] === boardState[c]
                ) {
                    statusText.textContent = "Player " + player + " wins!";
                    gameActive = false;
                    return true;
                }
            }

            return false;
        }

        function getBestMove() {
            let bestScore = -Infinity;
            let bestMove = null;

            for (let i = 0; i < boardState.length; i++) {
                if (boardState[i] !== "") {
                    continue;
                }

                boardState[i] = "O";
                const score = minimax(boardState, 0, false);
                boardState[i] = "";

                if (score > bestScore) {
                    bestScore = score;
                    bestMove = i;
                }
            }

            return bestMove;
        }

        function minimax(board, depth, isMaximizing) {
            const winner = getBoardWinner(board);
            if (winner === "O") {
                return 10 - depth;
            }
            if (winner === "X") {
                return depth - 10;
            }
            if (board.every(cell => cell !== "")) {
                return 0;
            }

            if (isMaximizing) {
                let bestScore = -Infinity;
                for (let i = 0; i < board.length; i++) {
                    if (board[i] !== "") {
                        continue;
                    }

                    board[i] = "O";
                    const score = minimax(board, depth + 1, false);
                    board[i] = "";
                    bestScore = Math.max(bestScore, score);
                }
                return bestScore;
            }

            let bestScore = Infinity;
            for (let i = 0; i < board.length; i++) {
                if (board[i] !== "") {
                    continue;
                }

                board[i] = "X";
                const score = minimax(board, depth + 1, true);
                board[i] = "";
                bestScore = Math.min(bestScore, score);
            }
            return bestScore;
        }

        function getBoardWinner(board) {
            for (const combination of winningCombinations) {
                const [a, b, c] = combination;
                if (board[a] !== "" && board[a] === board[b] && board[b] === board[c]) {
                    return board[a];
                }
            }
            return "";
        }

        function restartGame() {
            boardState = Array(9).fill("");
            cells.forEach(cell => {
                cell.textContent = "";
            });
            currentPlayer = "X";
            gameActive = true;
            statusText.textContent = "Player X's turn";
        }
    </script>
</body>
</html>
